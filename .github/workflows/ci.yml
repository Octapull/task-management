name: CI

# Ana dala giden her değişiklik ve her PR derlenip test ediliyor.
on:
  push:
    branches: [main, master]
  pull_request:

# Aynı dala arka arkaya push yapıldığında eski çalıştırmayı iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: .NET kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # Proje net10.0 hedefliyor ve SDK henüz önizlemede.
          dotnet-quality: preview

      - name: Bağımlılıkları geri yükle
        run: dotnet restore

      - name: Derle
        run: dotnet build --no-restore --configuration Release

      - name: Testler
        working-directory: .
        run: >
          dotnet test server.Tests/TaskManagementSystem.Tests.csproj
          --configuration Release
          --verbosity normal

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          # Angular 21'in istediği en düşük sürümün üzerinde.
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Bağımlılıkları kur
        # npm install değil: lock dosyasına birebir uyup sürüm sürprizini keser.
        run: npm ci

      # Not: `npx prettier --check` adımı bilerek yok. Depodaki dosyaların bir
      # kısmı Prettier'dan geçmemiş durumda ve baştan kırmızı yanan bir adım
      # eklemek kontrolü işe yaramaz hale getirirdi. Önce tek seferlik bir
      # biçimlendirme commit'i atılıp sonra bu adım eklenmeli.

      - name: Derle
        run: npm run build

      - name: Testler
        run: npx ng test

  docker:
    name: Docker (imaj + duman testi)
    runs-on: ubuntu-latest

    # Sadece "imaj derleniyor mu" değil, "üç konteyner birlikte ayağa kalkıp
    # çalışıyor mu" da kontrol ediliyor. docker-compose.yml çoğu zaman
    # geliştirici makinesinde denenmediği için asıl kırılan yer burası:
    # derlenen ama açılmayan bir yapılandırma kolayca fark edilmeden kalıyor.
    steps:
      - uses: actions/checkout@v4

      - name: Buildx kurulumu
        uses: docker/setup-buildx-action@v3

      - name: .env üret
        # Gerçek sır değil: compose yalnızca bu değerlerin dolu olmasını
        # şart koşuyor. E-posta Mock modda, dışarı hiçbir şey gitmiyor.
        run: |
          cat > .env <<'ENVEOF'
          POSTGRES_DB=taskmanagementsystem
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-test-parolasi
          JWT_KEY=Y2ktdGVzdC1hbmFodGFyaS0zMi1iYXl0LXV6dW5sdWt0YWRpcg==
          EMAIL_PROVIDER=Mock
          CLIENT_PORT=4200
          SERVER_PORT=5208
          DB_PORT=5433
          ASPNETCORE_ENVIRONMENT=Development
          ENVEOF

      - name: Yapılandırmayı doğrula
        run: docker compose config --quiet

      - name: İmajları derle
        run: docker compose build

      - name: Ayağa kaldır
        run: docker compose up -d

      - name: API sağlıklı mı
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5208/health > /dev/null 2>&1; then
              echo "API ayakta (${i}. deneme)"
              exit 0
            fi
            sleep 2
          done
          echo "API 120 saniyede açılmadı."
          exit 1

      - name: Şema kuruldu mu
        # Migration çalıştırıcısı boş veritabanında schema.sql'i uygulamış
        # olmalı; uygulanan dosyalar schema_migrations'a yazılıyor.
        run: |
          docker compose exec -T db \
            psql -U postgres -d taskmanagementsystem -tAc \
            'SELECT COUNT(*) FROM schema_migrations' | tee /tmp/migrations.txt
          test "$(cat /tmp/migrations.txt | tr -d '[:space:]')" -gt 0

      - name: Angular sunuluyor mu
        run: curl -fsS http://localhost:4200 | grep -q '<app-root'

      - name: nginx API'ye yönlendiriyor mu
        # Tarayıcının gördüğü yol bu: tek origin üzerinden /api.
        run: curl -fsS http://localhost:4200/api/teams/validate-code/YOKBOYLE > /dev/null

      - name: Demo verisi yükleniyor mu
        run: docker compose --profile demo run --rm seed

      - name: Giriş ve yenileme token'ı çalışıyor mu
        run: |
          curl -fsS -X POST http://localhost:5208/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@istakip.local","password":"Demo1234"}' \
            | grep -q '"refreshToken"'

      - name: Loglar
        if: failure()
        run: docker compose logs --no-color

      - name: Temizlik
        if: always()
        run: docker compose down -v
