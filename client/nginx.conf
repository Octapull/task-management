# Angular'ı sunan ve /api ile /hubs isteklerini backend'e ileten yapılandırma.
# Geliştirmede bu işi proxy.conf.json yapıyor; konteynerde onun karşılığı bu
# dosya. İkisi de aynı amaca hizmet ediyor: tarayıcı her şeyi tek origin'den
# görsün, CORS devreye hiç girmesin.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Ek dosya yüklemesi backend'de 10 MB'a kadar serbest. nginx'in 1 MB'lık
    # varsayılanı kalsaydı büyük dosya API'ye ulaşmadan 413 ile geri dönerdi.
    client_max_body_size 12m;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ^~ : bu önek eşleşince aşağıdaki regex konumu hiç denenmiyor. Aksi halde
    # ".js" ile biten bir API adresi statik dosya kuralına düşerdi.
    location ^~ /api/ {
        proxy_pass       http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR bağlantısı WebSocket'e yükseltiliyor. Upgrade/Connection
    # başlıkları aktarılmazsa bağlantı ya hiç kurulmaz ya da long-polling'e
    # düşer; read_timeout kısa kalırsa açık bağlantı boşta kaldığında kopar.
    location ^~ /hubs/ {
        proxy_pass       http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Dosya adları hash'li (outputHashing: all), içerik değişince ad da
    # değişiyor - bu yüzden uzun önbellek güvenli.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Yönlendirme tarayıcı tarafında. /board gibi bir adres doğrudan
    # açıldığında diskte karşılığı yok; index.html dönmeli ki Angular
    # yönlendirmeyi kendisi çözsün.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
